           C 30 235, 65 230, 95 235 
           C 65 225, 30 225, 5 235 
           C 35 215, 80 210, 115 220 
           C 80 205, 35 205, 10 215 
           C 45 195, 95 195, 130 208 
           C 90 188, 45 185, 20 195 
