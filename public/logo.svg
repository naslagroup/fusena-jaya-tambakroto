      <path
        d="M 80 730 
           C 220 690, 360 610, 520 615 
           C 640 620, 740 670, 860 730 
           C 740 770, 580 750, 430 700 
           C 320 665, 200 690, 80 730 Z"
        fill="#2AA6E2"
      />

      <!-- Streamer 2: Middle fluid ripple flowing left -->
      <path
        d="M 220 725 
           C 340 690, 460 715, 580 750 
           C 660 775, 700 795, 705 795 
           C 660 790, 595 760, 525 755 
           C 425 750, 310 730, 220 725 Z"
        fill="#2395D3"
      />

      <!-- Streamer 3: Wave crest ripple under main curl -->
      <path
        d="M 530 645 
           C 600 645, 680 675, 790 705 
           C 840 720, 880 700, 850 675 
           C 750 635, 660 615, 530 645 Z"
        fill="#0D527C"
      />

      <!-- The Great Tidal Wave Curl (Right) -->
      <path
        d="M 658 470 
           C 650 410, 665 330, 715 275 
           C 775 210, 875 220, 935 285 
           C 990 345, 1000 450, 975 550 
           C 945 650, 870 730, 770 770 
           C 690 800, 580 770, 530 725 
           C 570 720, 630 720, 680 690 
           C 740 650, 785 595, 800 535 
           C 805 510, 800 485, 775 480 
           C 740 475, 720 505, 720 525 
           C 720 545, 745 565, 745 580 
           C 745 600, 720 625, 675 625 
           C 620 625, 570 590, 545 565 
           C 605 575, 665 565, 690 525 
           C 715 480, 705 430, 740 410 
           C 770 395, 810 410, 830 440 
           C 870 500, 870 610, 780 670 
           C 860 630, 905 550, 915 470 
           C 925 390, 880 320, 810 315 
           C 740 310, 690 370, 680 425 
           C 675 450, 670 470, 658 470 Z"
        fill="#2AA6E2"
      />

      <!-- Wave Curl Internal Hook (Bright sky blue inner crest) -->
