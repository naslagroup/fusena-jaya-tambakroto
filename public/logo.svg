      />

      <!-- Frond 3: Upper Left & Top Fronds -->
      <path
        d="M 148 280 
           C 130 220, 95 150, 50 105 
           C 65 120, 85 145, 95 170 
           C 85 140, 65 100, 45 75 
           C 70 95, 95 130, 110 160 
           C 105 125, 85 80, 70 50 
           C 95 75, 118 115, 128 150 
           C 122 110, 105 65, 95 30 
           C 120 60, 138 105, 145 145 
           C 142 95, 130 45, 120 5 
           C 138 40, 150 85, 152 135 
           Z"
        fill="#00A859"
      />

      <!-- Frond 4: Top Center Frond -->
      <path
        d="M 152 275 
           C 155 210, 160 130, 165 30 
           C 162 60, 158 105, 155 150 
           C 170 100, 180 45, 185 0 
           C 178 45, 172 100, 168 155 
           C 185 110, 200 55, 210 15 
           C 198 65, 188 120, 180 175 
           C 198 130, 220 80, 235 40 
           C 218 90, 202 140, 192 195 
           Z"
        fill="#00A859"
      />

      <!-- Frond 5: Upper Right Arching Fronds -->
      <path
        d="M 155 285 
           C 175 240, 215 180, 270 130 
           C 250 150, 225 185, 208 215 
           C 235 180, 275 145, 305 120 
           C 275 155, 245 200, 225 235 
           C 255 205, 298 175, 325 155 
           C 290 190, 255 235, 235 265 
