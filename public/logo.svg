        d="M 720 525 
           C 730 500, 755 500, 770 515 
           C 790 535, 790 565, 775 590 
           C 750 625, 700 625, 665 615 
           C 700 605, 730 580, 730 555 
           C 730 535, 715 535, 720 525 Z"
        fill="#1E8CC2"
      />
    </g>

    <!-- ================= 4. TROPICAL COCONUT PALM TREE ================= -->
