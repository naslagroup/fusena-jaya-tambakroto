<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%">
  <g id="fusena-official-logo">
    <!-- ================= 1. GOLDEN SUN ================= -->
    <g id="sun">
      <!-- Golden yellow sun rising behind mountain -->
      <circle cx="485" cy="385" r="110" fill="#FAB612" />
    </g>

    <!-- ================= 2. MOUNTAIN SILHOUETTE ================= -->
    <g id="mountain">
      <!-- Deep navy blue mountain body -->
      <path
        d="M 220 635 
           L 320 575 
           L 395 490 
           L 440 450 
           L 475 430 
           L 500 405 
           L 535 414 
           L 570 435 
           L 615 450 
           L 655 460 
           L 730 530 
           L 890 670 
           L 180 700 
           Z"
        fill="#0D527C"
      />
      <!-- White mountain ridge / snowcap contour divider -->
      <path
        d="M 395 490 
           L 440 450 
           L 475 430 
           L 500 405 
           L 535 414 
           L 570 435 
           L 615 450 
           L 655 460"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- ================= 3. OCEAN WAVES ================= -->
    <g id="ocean-waves">
      <!-- Deep navy wave shadow base -->
      <path
        d="M 180 700 
           C 280 640, 420 610, 520 615 
           C 620 620, 720 660, 890 670 
           C 850 705, 780 740, 680 740 
           C 520 740, 350 715, 180 700 Z"
        fill="#083C5A"
