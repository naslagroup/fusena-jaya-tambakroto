    <!-- ================= 5. TYPOGRAPHY (CV. FUSENA JAYA) ================= -->
    <!-- Exact bold condensed letterforms in official emerald green -->
    <g id="logo-typography" fill="#00A859">
      <text
        x="540"
        y="845"
        font-family="'Impact', 'Arial Black', 'Montserrat', 'Bebas Neue', 'Oswald', sans-serif"
        font-size="78"
        font-weight="900"
        letter-spacing="6"
        text-anchor="middle"
