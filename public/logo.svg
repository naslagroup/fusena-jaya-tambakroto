      <path
        d="M 155 295 
           C 180 270, 225 250, 275 240 
           C 255 255, 230 270, 205 285 
           C 240 275, 280 265, 305 260 
           C 270 280, 235 300, 200 315 
           C 230 308, 270 305, 290 305 
           C 255 320, 215 335, 180 345 
           C 170 330, 160 315, 155 295 
           Z"
        fill="#00A859"
      />
